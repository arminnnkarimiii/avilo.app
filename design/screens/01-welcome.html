<html lang="en">
<head>
<meta charset="utf-8">

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Pixelify+Sans:wght@600&amp;display=swap">
<style>
body{margin:0}
.avi{image-rendering:pixelated;mix-blend-mode:multiply;object-fit:contain}
a{color:#A0531C}a:hover{color:#3B2418}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF6E8; font-family: Nunito, ui-rounded, system-ui, sans-serif; color: #3B2418; display: flex; flex-direction: column; padding: 64px 24px 40px; gap: 24px; position: relative; overflow: hidden">
  <div style="position: absolute; right: -60px; top: -40px; width: 220px; height: 220px; border-radius: 999px; background: #FCEBD3"></div>
  <div style="position: absolute; left: -80px; bottom: 150px; width: 180px; height: 180px; border-radius: 999px; background: #FCEBD3"></div>
  <div style="display: flex; align-items: center; gap: 10px; position: relative">
    <img class="avi" src="/_blob/161ae7725de7dae184ec81becdbbf165" alt="" style="width: 40px; height: 40px">
    <span style="font-size: 24px; font-weight: 900; letter-spacing: -0.5px">Avilo</span>
  </div>
  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; position: relative">
    <div style="position: relative; background: #FFFFFF; border: 2px solid #EED9BF; border-radius: 20px; padding: 14px 18px; font-size: 20px; font-weight: 800; line-height: 26px; text-align: center; align-self: center">Hi! I'm Avi.<br>Let's build a learning adventure just for your child.</div>
    <div style="width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 12px solid #EED9BF"></div>
    <div style="width: 280px; height: 280px; border-radius: 999px; background: #FCEBD3; display: grid; place-items: center">
      <img class="avi" src="/_blob/495653d7e20e317301bcab84f552ca87" alt="Avi the bear waving hello" style="width: 260px; height: 260px">
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px; position: relative">
    <h1 style="margin: 0; font-size: 30px; line-height: 36px; font-weight: 900; text-align: center; text-wrap: balance">Smarter from the very start</h1>
    <p style="margin: 0; font-size: 16px; line-height: 23px; font-weight: 600; color: #7A5A45; text-align: center">Games, stories and skills for ages 3–12, shaped around who your child is.</p>
    <a href="QuizName.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #D63B2F; color: #FFFFFF; font-size: 19px; font-weight: 800; text-decoration: none; box-shadow: 0 5px 0 #A8281E">Get started</a>
    <a href="SignIn.dc.html" style="text-align: center; font-size: 15px; font-weight: 700; color: #A0531C; padding: 6px">I already have an account</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
kidNames() {
let v = '';
try { v = (localStorage.getItem('avilo.kid') || '').trim(); } catch (e) {}
const has = !!v;
const K = has ? v : 'your child';
const KC = has ? v : 'Your child';
const KP = has ? v + (/s$/i.test(v) ? "'" : "'s") : "your child's";
const KPC = has ? KP : "Your child's";
return { K: K, KC: KC, KP: KP, KPC: KPC, KPU: KP.toUpperCase(), KI: has ? v.charAt(0).toUpperCase() : '?' };
}
renderVals() {
const n = this.kidNames();
return Object.assign({ kid: n.K, kidCap: n.KC, kidPos: n.KP, kidPosCap: n.KPC, kidPosUpper: n.KPU, kidInitial: n.KI }, this._rv());
}
_rv() {
const { K, KC, KP, KPC } = this.kidNames();
return {};
}
}
</script>
</body>
</html>
