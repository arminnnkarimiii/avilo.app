<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
kidNames() {
let v = '';
try { v = (localStorage.getItem('avilo.kid') || '').trim(); } catch (e) {}
const has = !!v;
const K = has ? v : 'your child';
const KC = has ? v : 'Your child';
const KP = has ? v + (/s$/i.test(v) ? "'" : "'s") : "your child's";
const KPC = has ? KP : "Your child's";
return { K: K, KC: KC, KP: KP, KPC: KPC, KPU: KP.toUpperCase(), KI: has ? v.charAt(0).toUpperCase() : '?' };
}
renderVals() {
const n = this.kidNames();
return Object.assign({ txt1: (n.KPC + " plan is ready. Try it free for 7 days.").trim(), kid: n.K, kidCap: n.KC, kidPos: n.KP, kidPosCap: n.KPC, kidPosUpper: n.KPU, kidInitial: n.KI }, this._rv());
}
_rv() {
const { K, KC, KP, KPC } = this.kidNames();
const yearly = !this.state || this.state.plan !== 'month';
return {
yearly: yearly, monthly: !yearly,
pickYear: () => this.setState({ plan: 'year' }),
pickMonth: () => this.setState({ plan: 'month' }),
perks: ['A path made for ' + K + ', updated as they grow', 'New stories starring ' + K + ' every night', 'All 4 worlds: math, reading, science, feelings', 'Weekly progress reports for you']
};
}
}
</script>
