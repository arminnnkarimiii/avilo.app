    <h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 900; text-wrap: balance">{{txt1}}</h1>

  <p style="margin: 0; font-size: 13px; line-height: 18px; font-weight: 600; color: #7A5A45; text-align: center">{{txt2}}</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
kidNames() {
let v = '';
try { v = (localStorage.getItem('avilo.kid') || '').trim(); } catch (e) {}
const has = !!v;
const K = has ? v : 'your child';
const KC = has ? v : 'Your child';
const KP = has ? v + (/s$/i.test(v) ? "'" : "'s") : "your child's";
const KPC = has ? KP : "Your child's";
return { K: K, KC: KC, KP: KP, KPC: KPC, KPU: KP.toUpperCase(), KI: has ? v.charAt(0).toUpperCase() : '?' };
}
renderVals() {
const n = this.kidNames();
return Object.assign({ txt1: ("Let's keep " + n.KP + " plan safe").trim(), txt2: ("You can hide your email with Apple. We store only " + n.KP + " first name and age, never photos or location.").trim(), kid: n.K, kidCap: n.KC, kidPos: n.KP, kidPosCap: n.KPC, kidPosUpper: n.KPU, kidInitial: n.KI }, this._rv());
}
_rv() {
const { K, KC, KP, KPC } = this.kidNames();
return {};
}
}
</script>
