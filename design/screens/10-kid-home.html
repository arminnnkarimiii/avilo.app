<style>
body{margin:0}
.px{image-rendering:pixelated;object-fit:contain}
.tile{border:0;cursor:pointer;font-family:Nunito,ui-rounded,system-ui,sans-serif;color:#3B2418}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #A8281E,0 0 0 0 rgba(214,59,47,.35)}50%{box-shadow:0 6px 0 #A8281E,0 0 0 12px rgba(214,59,47,0)}}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.sway{animation:sway 3s ease-in-out infinite;transform-origin:50% 100%}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.up{animation:up .32s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .2s ease-out both}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.08) rotate(2deg)}}
.flick{animation:flick 1.2s ease-in-out infinite;transform-origin:50% 90%}
@keyframes pkR{0%,100%{transform:translateX(150px) rotate(-90deg)}25%,72%{transform:translateX(0) rotate(-90deg)}}
@keyframes pkL{0%,100%{transform:translateX(-150px) rotate(90deg)}25%,72%{transform:translateX(0) rotate(90deg)}}
@keyframes pkBR{0%,100%{transform:translate(120px,120px) rotate(-35deg)}25%,72%{transform:translate(0,0) rotate(-35deg)}}
@keyframes pkBL{0%,100%{transform:translate(-120px,120px) rotate(35deg)}25%,72%{transform:translate(0,0) rotate(35deg)}}
.pk{position:absolute;width:120px;height:82px;pointer-events:none;z-index:30;image-rendering:pixelated}
.pkR{right:-34px;top:330px;animation:pkR 1.7s ease-in-out both}
.pkL{left:-34px;top:430px;animation:pkL 1.7s ease-in-out both}
.pkBR{right:-26px;bottom:70px;animation:pkBR 1.7s ease-in-out both}
.pkBL{left:-26px;bottom:70px;animation:pkBL 1.7s ease-in-out both}
@media (prefers-reduced-motion: reduce){.pulse,.sway,.up,.fade,.flick{animation:none}}
</style>

  <sc-if value="{{peekBR}}" hint-placeholder-val="{{false}}"><img class="pk pkBR" src="/_blob/485777b8dd40805eecc5714902d6151d" alt=""></sc-if>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const WORLDS = [

  { id: 'reading', name: 'Reading', c: '#2F86C9', soft: '#DDEEFB', d: 'M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2zM4 19V5' },
  { id: 'science', name: 'Science', c: '#8466D6', soft: '#ECE6FB', d: 'M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3' },
  { id: 'feelings', name: 'Feelings', c: '#E46A8E', soft: '#FCE4EB', d: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z' },
  { id: 'logic', name: 'Logic', c: '#2F86C9', soft: '#DDEEFB', d: 'M4 4h7v7H4zM13 13h7v7h-7zM13 4h7v7h-7z' },
  { id: 'memory', name: 'Memory', c: '#8466D6', soft: '#ECE6FB', d: 'M7 4h10v16H7zM10 8h4M10 12h4' },
  { id: 'creativity', name: 'Create', c: '#D63B2F', soft: '#FCE4EB', d: 'M4 20l4-1 11-11-3-3L5 16zM14 7l3 3' },

];
const TITLES = { cubs: [['math-cubs-01', 'Dino eggs'], ['reading-cubs-01', 'Letter sounds'], ['feelings-cubs-01', 'How Avi feels']], explorers: [['math-explorers-01', 'Dino tracks'], ['reading-explorers-01', 'Blend words'], ['science-explorers-02', 'Planets']], trailblazers: [['math-trailblazers-01', 'Times tables'], ['logic-trailblazers-03', 'Mystery grid'], ['reading-trailblazers-02', 'Context clues']] };
function get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function put(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
class Component extends DCLogic {
  componentDidMount() { this.schedule(6000); }
  componentWillUnmount() { clearTimeout(this.pt); clearTimeout(this.ht); }
  schedule(ms) {
    clearTimeout(this.pt);
    this.pt = setTimeout(() => {
      const corners = ['R', 'L', 'BR', 'BL'];
      if (!(this.state || {}).sheet) this.setState({ peek: corners[Math.floor(Math.random() * corners.length)] });
      this.ht = setTimeout(() => this.setState({ peek: null }), 1800);
      this.schedule(180000 + Math.random() * 180000);
    }, ms);
  }
  say(t) { try { const u = new SpeechSynthesisUtterance(t); u.rate = 0.95; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
  renderVals() {
    const s = this.state || {};
    const name = get('avilo.kid').trim();
    const age = parseInt(get('avilo.age') || '5', 10);
    const band = age <= 5 ? 'cubs' : age <= 8 ? 'explorers' : 'trailblazers';
    const COL = { red: '#D63B2F', orange: '#E9873A', yellow: '#F5B53D', green: '#4E9F3D', blue: '#2F86C9', purple: '#8466D6', pink: '#E46A8E', brown: '#A0531C' };
    let done = {}; try { done = JSON.parse(get('avilo.done') || '{}'); } catch (e) {}
    let attempts = []; try { attempts = JSON.parse(get('avilo.attempts') || '[]'); } catch (e) {}
    const days = new Set(attempts.map((a) => new Date(a.ts).toDateString()));
    let streak = 0; const d0 = new Date(); if (!days.has(d0.toDateString())) d0.setDate(d0.getDate() - 1);
    for (let d = d0; days.has(d.toDateString()); d.setDate(d.getDate() - 1)) streak++;
    const shownStreak = attempts.length ? streak : 5;
    const today = TITLES[band].map((t, k) => {
      const isDone = done[t[0]] !== undefined, firstOpen = TITLES[band].findIndex((x) => done[x[0]] === undefined);
      const cur = k === firstOpen;
      return { title: t[1], aria: (isDone ? 'Done: ' : 'Play: ') + t[1], size: cur ? 80 : 64, mt: cur ? 0 : 8, cls: cur ? 'pulse' : '',
        bg: isDone ? '#4E9F3D' : cur ? '#D63B2F' : '#FCEBD3', border: isDone || cur ? '0' : '3px dashed #D9894A', shadow: cur ? '0 6px 0 #A8281E' : 'none',
        icon: isDone ? 'M5 12.5l4.5 4.5L19 7.5' : 'M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z', iconFill: isDone ? 'none' : cur ? '#FFFFFF' : '#D9894A', iconStroke: isDone ? '#FFFFFF' : 'none',
        go: () => put('avilo.activity', t[0]) };
    });
    const nDone = today.filter((t) => t.icon.startsWith('M5')).length;
    const week = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((day, i) => {
      const ref = new Date(); const dow = (ref.getDay() + 6) % 7; const d = new Date(ref); d.setDate(ref.getDate() - (dow - i));
      const isDone = days.has(d.toDateString()) || (!attempts.length && i < 5), isToday = i === dow;
      return { day: day, mark: isDone ? '✓' : isToday ? '•' : '', bg: isDone ? '#D63B2F' : '#FFF6E8', fg: isDone ? '#FFFFFF' : '#A0531C', border: isToday && !isDone ? '3px dashed #D63B2F' : '2px solid #EED9BF' };
    });
    const who = name || 'friend';
    return {
      kidName: name || 'Me', initial: (name || '?').charAt(0).toUpperCase(), kidColor: COL[get('avilo.color')] || '#8466D6',
      streak: String(shownStreak), streakAria: shownStreak + ' day streak', streakTitle: shownStreak + '-day streak!',
      streakText: 'You have learned with Avi ' + shownStreak + (shownStreak === 1 ? ' day' : ' days') + ' in a row, ' + who + '. Play today to keep your flame going, and come back tomorrow for day ' + (shownStreak + 1) + '!',

      today: today, todayCount: nDone + ' of 3 done',
      worldsSub: '20 activities each',
      worlds: WORLDS.map((w) => { const n = Object.keys(done).filter((id) => id.startsWith(w.id + '-' + band)).length; return { ...w, p: Math.max(4, Math.round(n / 20 * 100)), go: () => put('avilo.world', w.id) }; }),
      tabs: [
        { label: 'Home', fg: '#D63B2F', href: '#home', d: 'M4 11l8-7 8 7v9h-5v-6H9v6H4z' },
        { label: 'Road', fg: '#7A5A45', href: 'TrophyRoad.dc.html', d: 'M8 21l2-18M16 21l-2-18M12 6v2M12 12v2M12 18v2' },
        { label: 'Stories', fg: '#7A5A45', href: 'Stories.dc.html', d: 'M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2zM4 19V5' },
        { label: 'Grown-ups', fg: '#7A5A45', href: 'ParentDash.dc.html', d: 'M7 11V8a5 5 0 0 1 10 0v3M5 11h14v10H5z' }
      ],
      peekR: s.peek === 'R', peekL: s.peek === 'L', peekBR: s.peek === 'BR', peekBL: s.peek === 'BL',
      sheet: !!s.sheet, openStreak: () => this.setState({ sheet: true, peek: null }), close: () => this.setState({ sheet: false })

  }
