<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Story book</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
.tile{border:0;cursor:pointer;font-family:Nunito,ui-rounded,system-ui,sans-serif}
@keyframes turn{from{transform:perspective(900px) rotateY(-14deg);opacity:.4}to{transform:none;opacity:1}}
.turn{animation:turn .4s ease-out both}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
.tw{animation:tw 2.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.turn,.tw{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2A1E17; font-family: Nunito, ui-rounded, system-ui, sans-serif; color: #FCEFDF; display: flex; flex-direction: column; padding: 54px 16px 24px; gap: 12px; position: relative; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="Stories.dc.html" aria-label="Back to the library" style="width: 44px; height: 44px; border-radius: 999px; background: #35261C; display: grid; place-items: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FCEFDF" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
    <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
      <span style="font-size: 12px; font-weight: 900; letter-spacing: 1px; color: #F7C25A">{{byline}}</span>
      <span style="font-size: 16px; font-weight: 900; line-height: 20px">{{title}}</span>
    </div>
  </div>

  <div class="turn" style="flex-grow: 1; min-height: 0; background: #FFF6E8; border-radius: 26px; color: #3B2418; display: flex; flex-direction: column; overflow: hidden">
    <svg width="358" height="240" viewBox="0 0 360 240" role="img" aria-label="{{sceneAria}}" style="flex: none; display: block">
      <sc-if value="{{sky.day}}" hint-placeholder-val="{{true}}"><rect data-sky="day" width="360" height="240" fill="#BFE3F7"/></sc-if>
      <sc-if value="{{sky.dusk}}" hint-placeholder-val="{{false}}"><g data-sky="dusk"><rect width="360" height="240" fill="#F6C28B"/><rect y="0" width="360" height="70" fill="#EFA07A"/></g></sc-if>
      <sc-if value="{{sky.night}}" hint-placeholder-val="{{false}}"><g data-sky="night"><rect width="360" height="240" fill="#2B3A67"/><circle class="tw" cx="40" cy="30" r="1.8" fill="#FFF6E8"/><circle class="tw" cx="120" cy="20" r="1.4" fill="#FFF6E8"/><circle class="tw" cx="200" cy="40" r="1.6" fill="#FFF6E8"/><circle class="tw" cx="330" cy="25" r="1.4" fill="#FFF6E8"/></g></sc-if>
      <sc-if value="{{sky.space}}" hint-placeholder-val="{{false}}"><g data-sky="space"><rect width="360" height="240" fill="#1C1838"/><circle class="tw" cx="30" cy="40" r="1.6" fill="#FFF6E8"/><circle class="tw" cx="90" cy="150" r="1.2" fill="#FFF6E8"/><circle class="tw" cx="160" cy="30" r="1.8" fill="#FFF6E8"/><circle class="tw" cx="240" cy="120" r="1.3" fill="#FFF6E8"/><circle class="tw" cx="340" cy="200" r="1.5" fill="#FFF6E8"/><circle class="tw" cx="300" cy="20" r="1.2" fill="#FFF6E8"/></g></sc-if>
      <sc-if value="{{sky.sea}}" hint-placeholder-val="{{false}}"><g data-sky="sea"><rect width="360" height="240" fill="#3E8FC6"/><rect width="360" height="60" fill="#5AA6D6"/><circle cx="60" cy="120" r="4" fill="none" stroke="#BFE3F7" stroke-width="1.5"/><circle cx="250" cy="70" r="3" fill="none" stroke="#BFE3F7" stroke-width="1.5"/><circle cx="320" cy="130" r="5" fill="none" stroke="#BFE3F7" stroke-width="1.5"/></g></sc-if>
      <sc-if value="{{sky.indoor}}" hint-placeholder-val="{{false}}"><g data-sky="indoor"><rect width="360" height="240" fill="#F3E2C7"/><rect y="150" width="360" height="6" fill="#E2C9A4"/><rect x="250" y="30" width="70" height="60" rx="6" fill="#DDEEFB" stroke="#E2C9A4" stroke-width="5"/></g></sc-if>
      <sc-if value="{{ground.grass}}" hint-placeholder-val="{{true}}"><rect data-ground="grass" y="196" width="360" height="44" fill="#7CBF5E"/></sc-if>
      <sc-if value="{{ground.hills}}" hint-placeholder-val="{{false}}"><g data-ground="hills"><ellipse cx="80" cy="240" rx="170" ry="60" fill="#6BAF4E"/><ellipse cx="300" cy="245" rx="160" ry="55" fill="#7CBF5E"/></g></sc-if>
      <sc-if value="{{ground.sand}}" hint-placeholder-val="{{false}}"><rect data-ground="sand" y="200" width="360" height="40" fill="#F1D49A"/></sc-if>
      <sc-if value="{{ground.water}}" hint-placeholder-val="{{false}}"><g data-ground="water"><rect y="196" width="360" height="44" fill="#5AA6D6"/><path d="M0 204q15-6 30 0t30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0 30 0" fill="none" stroke="#BFE3F7" stroke-width="2"/></g></sc-if>
      <sc-if value="{{ground.floor}}" hint-placeholder-val="{{false}}"><g data-ground="floor"><rect y="198" width="360" height="42" fill="#C9965F"/><rect y="198" width="360" height="4" fill="#A0703E"/></g></sc-if>
      <sc-if value="{{ground.moon}}" hint-placeholder-val="{{false}}"><g data-ground="moon"><ellipse cx="180" cy="250" rx="260" ry="60" fill="#B9B3C9"/><circle cx="90" cy="215" r="7" fill="#9E97B3"/><circle cx="260" cy="222" r="5" fill="#9E97B3"/></g></sc-if>
      <sc-if value="{{ground.none}}" hint-placeholder-val="{{false}}"><g data-ground="none"></g></sc-if>
      <sc-for list="{{props}}" as="p" hint-placeholder-count="3">
        <g transform="{{p.tf}}">
          <sc-if value="{{p.is.kid}}" hint-placeholder-val="{{false}}"><g data-kind="kid"><rect x="-8" y="-22" width="6" height="22" rx="2" fill="#3B2418"/><rect x="2" y="-22" width="6" height="22" rx="2" fill="#3B2418"/><path d="M-14 -20 L14 -20 L11 -50 L-11 -50 Z" fill="{{kidColor}}"/><rect x="-20" y="-48" width="7" height="22" rx="3" fill="{{kidColor}}"/><rect x="13" y="-48" width="7" height="22" rx="3" fill="{{kidColor}}"/><circle cy="-62" r="13" fill="#F2C29B"/><path d="{{hairPath}}" fill="#5C3317"/><circle cx="-4.5" cy="-63" r="1.7" fill="#3B2418"/><circle cx="4.5" cy="-63" r="1.7" fill="#3B2418"/><path d="M-4 -57 q4 3 8 0" fill="none" stroke="#3B2418" stroke-width="1.5" stroke-linecap="round"/></g></sc-if>
          <sc-if value="{{p.is.dino}}" hint-placeholder-val="{{false}}"><g data-kind="dino"><path d="M-40 -18 q-20 6 -30 -2 q14 -2 22 -14 z" fill="#4E9F3D"/><ellipse cy="-24" rx="30" ry="20" fill="#5DB14A"/><path d="M14 -34 q6 -30 22 -34 q14 -2 14 10 q0 8 -12 8 l-6 22 z" fill="#5DB14A"/><circle cx="40" cy="-60" r="2.2" fill="#3B2418"/><rect x="-18" y="-10" width="9" height="12" rx="3" fill="#4E9F3D"/><rect x="8" y="-10" width="9" height="12" rx="3" fill="#4E9F3D"/><path d="M-14 -42 l6 -8 6 8 M2 -44 l6 -8 6 8" fill="#F5B53D"/></g></sc-if>
          <sc-if value="{{p.is.cat}}" hint-placeholder-val="{{false}}"><g data-kind="cat"><path d="M18 -14 q22 -4 18 -28" fill="none" stroke="#E9873A" stroke-width="5" stroke-linecap="round"/><ellipse cy="-14" rx="20" ry="13" fill="#E9873A"/><circle cx="-14" cy="-30" r="11" fill="#E9873A"/><path d="M-23 -36 l2 -12 7 8z M-12 -40 l6 -9 3 11z" fill="#E9873A"/><circle cx="-18" cy="-31" r="1.5" fill="#3B2418"/><circle cx="-11" cy="-31" r="1.5" fill="#3B2418"/></g></sc-if>
          <sc-if value="{{p.is.dog}}" hint-placeholder-val="{{false}}"><g data-kind="dog"><ellipse cy="-16" rx="22" ry="13" fill="#C08552"/><circle cx="-18" cy="-32" r="12" fill="#C08552"/><path d="M-30 -36 q-6 10 2 16 l4 -12z" fill="#7A3E14"/><circle cx="-21" cy="-34" r="1.6" fill="#3B2418"/><circle cx="-28" cy="-29" r="2.4" fill="#3B2418"/><rect x="-14" y="-6" width="6" height="8" fill="#C08552"/><rect x="8" y="-6" width="6" height="8" fill="#C08552"/><path d="M20 -20 q12 -6 10 -16" fill="none" stroke="#C08552" stroke-width="4" stroke-linecap="round"/><rect x="-24" y="-22" width="12" height="3" rx="1.5" fill="#D63B2F"/></g></sc-if>
          <sc-if value="{{p.is.rocket}}" hint-placeholder-val="{{false}}"><g data-kind="rocket"><path d="M0 -90 q22 22 16 70 h-32 q-6 -48 16 -70z" fill="#E9E4F5"/><path d="M-16 -30 l-12 26 14 -6z M16 -30 l12 26 -14 -6z" fill="#D63B2F"/><path d="M-8 -20 h16 l-8 24z" fill="#F5B53D"/><circle cy="-58" r="8" fill="#2F86C9" stroke="#FFFFFF" stroke-width="2"/></g></sc-if>
          <sc-if value="{{p.is.tree}}" hint-placeholder-val="{{false}}"><g data-kind="tree"><rect x="-6" y="-44" width="12" height="44" fill="#7A3E14"/><circle cy="-62" r="26" fill="#4E9F3D"/><circle cx="-18" cy="-48" r="16" fill="#5DB14A"/><circle cx="18" cy="-50" r="17" fill="#5DB14A"/></g></sc-if>
          <sc-if value="{{p.is.house}}" hint-placeholder-val="{{false}}"><g data-kind="house"><rect x="-38" y="-52" width="76" height="52" fill="#F2C98F"/><path d="M-46 -50 L0 -86 L46 -50 Z" fill="#D63B2F"/><rect x="-10" y="-30" width="20" height="30" fill="#7A3E14"/><rect x="-32" y="-44" width="16" height="14" fill="#FFF0B3"/><rect x="16" y="-44" width="16" height="14" fill="#FFF0B3"/></g></sc-if>
          <sc-if value="{{p.is.fish}}" hint-placeholder-val="{{false}}"><g data-kind="fish"><path d="M-22 -14 q16 -18 34 -4 l10 -8 v24 l-10 -8 q-18 14 -34 -4z" fill="#E9873A"/><circle cx="-12" cy="-16" r="2" fill="#3B2418"/></g></sc-if>
          <sc-if value="{{p.is.whale}}" hint-placeholder-val="{{false}}"><g data-kind="whale"><path d="M-60 -20 q10 -40 60 -40 q40 0 50 30 l20 -20 v40 l-20 -12 q-20 24 -70 22 q-36 -2 -40 -20z" fill="#4A6FA5"/><path d="M-50 -14 q40 16 90 -4" fill="none" stroke="#BFE3F7" stroke-width="3"/><circle cx="-34" cy="-34" r="3" fill="#FFFFFF"/><path d="M-10 -62 q-6 -14 0 -20 q6 6 0 20" fill="#BFE3F7"/></g></sc-if>
          <sc-if value="{{p.is.robot}}" hint-placeholder-val="{{false}}"><g data-kind="robot"><rect x="-18" y="-40" width="36" height="34" rx="6" fill="#9DB4C8"/><rect x="-14" y="-70" width="28" height="26" rx="6" fill="#B9CADA"/><rect x="-9" y="-64" width="18" height="12" rx="3" fill="#2B3A67"/><circle cx="-4" cy="-58" r="2" fill="#7CE0A0"/><circle cx="4" cy="-58" r="2" fill="#7CE0A0"/><rect x="-1.5" y="-82" width="3" height="12" fill="#7A8C9C"/><circle cy="-84" r="4" fill="#D63B2F"/><rect x="-14" y="-6" width="10" height="8" rx="2" fill="#7A8C9C"/><rect x="4" y="-6" width="10" height="8" rx="2" fill="#7A8C9C"/></g></sc-if>
          <sc-if value="{{p.is.star}}" hint-placeholder-val="{{false}}"><g data-kind="star"><path d="M0 -40 l10 22 24 2 -18 16 6 24 -22 -12 -22 12 6 -24 -18 -16 24 -2z" fill="#F7C25A"/></g></sc-if>
          <sc-if value="{{p.is.cloud}}" hint-placeholder-val="{{false}}"><g data-kind="cloud"><circle cx="-20" cy="-14" r="16" fill="#FFFFFF"/><circle cx="4" cy="-24" r="22" fill="#FFFFFF"/><circle cx="28" cy="-14" r="16" fill="#FFFFFF"/><rect x="-36" y="-16" width="80" height="16" rx="8" fill="#FFFFFF"/></g></sc-if>
          <sc-if value="{{p.is.flower}}" hint-placeholder-val="{{false}}"><g data-kind="flower"><rect x="-2" y="-30" width="4" height="30" fill="#4E9F3D"/><circle cx="0" cy="-40" r="7" fill="#E46A8E"/><circle cx="-9" cy="-34" r="7" fill="#E46A8E"/><circle cx="9" cy="-34" r="7" fill="#E46A8E"/><circle cx="-6" cy="-46" r="7" fill="#E46A8E"/><circle cx="6" cy="-46" r="7" fill="#E46A8E"/><circle cy="-40" r="5" fill="#F5B53D"/></g></sc-if>
          <sc-if value="{{p.is.book}}" hint-placeholder-val="{{false}}"><g data-kind="book"><path d="M-28 -36 h26 q2 0 2 2 v34 q0 -2 -2 -2 h-26z" fill="#2F86C9"/><path d="M28 -36 h-26 q-2 0 -2 2 v34 q0 -2 2 -2 h26z" fill="#8466D6"/><path d="M-22 -28 h16 M-22 -20 h16 M6 -28 h16 M6 -20 h16" stroke="#FFF6E8" stroke-width="2"/></g></sc-if>
          <sc-if value="{{p.is.boat}}" hint-placeholder-val="{{false}}"><g data-kind="boat"><path d="M-40 -18 h80 l-14 18 h-52z" fill="#D63B2F"/><rect x="-2" y="-70" width="4" height="52" fill="#7A3E14"/><path d="M2 -66 l30 40 h-30z" fill="#FFF6E8"/></g></sc-if>
          <sc-if value="{{p.is.mountain}}" hint-placeholder-val="{{false}}"><g data-kind="mountain"><path d="M-70 0 L-10 -80 L50 0 Z" fill="#8C6E5A"/><path d="M-22 -64 L-10 -80 L2 -64 L-4 -58 L-10 -64 L-16 -58 Z" fill="#FFFFFF"/><path d="M10 0 L50 -50 L90 0 Z" fill="#A07F69"/></g></sc-if>
          <sc-if value="{{p.is.volcano}}" hint-placeholder-val="{{false}}"><g data-kind="volcano"><path d="M-70 0 L-18 -70 L18 -70 L70 0 Z" fill="#7A5A45"/><path d="M-18 -70 q18 -10 36 0 l-8 14 q-10 -8 -20 0z" fill="#D63B2F"/><path d="M-6 -66 q-4 20 -14 30 q10 -4 18 -18z" fill="#E9873A"/><circle cx="-6" cy="-92" r="10" fill="#B9B3C9"/><circle cx="8" cy="-104" r="13" fill="#CFCADB"/></g></sc-if>
          <sc-if value="{{p.is.bed}}" hint-placeholder-val="{{false}}"><g data-kind="bed"><rect x="-50" y="-30" width="100" height="22" rx="6" fill="#8466D6"/><rect x="-50" y="-50" width="8" height="50" fill="#7A3E14"/><rect x="42" y="-38" width="8" height="38" fill="#7A3E14"/><rect x="-42" y="-38" width="26" height="10" rx="5" fill="#FFFFFF"/></g></sc-if>
          <sc-if value="{{p.is.planet}}" hint-placeholder-val="{{false}}"><g data-kind="planet"><circle cy="-30" r="24" fill="#E9873A"/><ellipse cy="-30" rx="40" ry="9" fill="none" stroke="#F7C25A" stroke-width="4"/><circle cx="-8" cy="-38" r="4" fill="#D9731E"/></g></sc-if>
          <sc-if value="{{p.is.moon}}" hint-placeholder-val="{{false}}"><g data-kind="moon"><path d="M8 -50 a26 26 0 1 0 18 40 a20 20 0 0 1 -18 -40z" fill="#F7E7A6"/></g></sc-if>
          <sc-if value="{{p.is.sun}}" hint-placeholder-val="{{false}}"><g data-kind="sun"><circle cy="-24" r="18" fill="#F5B53D"/><path d="M0 -50 v-8 M0 2 v8 M-26 -24 h-8 M26 -24 h8 M-18 -42 l-6 -6 M18 -42 l6 -6 M-18 -6 l-6 6 M18 -6 l6 6" stroke="#E9873A" stroke-width="4" stroke-linecap="round"/></g></sc-if>
          <sc-if value="{{p.is.dragon}}" hint-placeholder-val="{{false}}"><g data-kind="dragon"><path d="M-10 -40 q-40 -40 -60 -10 q24 -6 34 18z" fill="#E9873A"/><ellipse cy="-26" rx="34" ry="22" fill="#D63B2F"/><path d="M24 -40 q10 -36 30 -36 q14 0 12 14 q-2 8 -14 6 l-12 20z" fill="#D63B2F"/><circle cx="52" cy="-68" r="3" fill="#FFF6E8"/><circle cx="52" cy="-68" r="1.4" fill="#3B2418"/><circle cx="44" cy="-68" r="6" fill="none" stroke="#3B2418" stroke-width="1.5"/><circle cx="58" cy="-68" r="6" fill="none" stroke="#3B2418" stroke-width="1.5"/><path d="M-34 -18 q-26 6 -36 -6" fill="none" stroke="#D63B2F" stroke-width="8" stroke-linecap="round"/><path d="M-16 -46 l6 -10 6 10 M4 -48 l6 -10 6 10" fill="#F5B53D"/></g></sc-if>
          <sc-if value="{{p.is.owl}}" hint-placeholder-val="{{false}}"><g data-kind="owl"><ellipse cy="-24" rx="18" ry="24" fill="#A0703E"/><ellipse cy="-18" rx="11" ry="14" fill="#F3E2C7"/><circle cx="-7" cy="-36" r="7" fill="#FFF6E8"/><circle cx="7" cy="-36" r="7" fill="#FFF6E8"/><circle cx="-7" cy="-36" r="3" fill="#3B2418"/><circle cx="7" cy="-36" r="3" fill="#3B2418"/><path d="M-3 -30 l3 5 3 -5z" fill="#F5B53D"/><path d="M-14 -46 l2 -8 6 6z M14 -46 l-2 -8 -6 6z" fill="#A0703E"/></g></sc-if>
          <sc-if value="{{p.is.ball}}" hint-placeholder-val="{{false}}"><g data-kind="ball"><circle cy="-16" r="16" fill="#FFFFFF" stroke="#3B2418" stroke-width="2"/><path d="M0 -22 l6 4 -2 7 h-8 l-2 -7z" fill="#3B2418"/></g></sc-if>
          <sc-if value="{{p.is.crown}}" hint-placeholder-val="{{false}}"><g data-kind="crown"><path d="M-24 0 v-26 l12 12 12 -20 12 20 12 -12 v26z" fill="#F5B53D"/><circle cx="0" cy="-12" r="4" fill="#D63B2F"/></g></sc-if>
          <sc-if value="{{p.is.map}}" hint-placeholder-val="{{false}}"><g data-kind="map"><path d="M-40 -60 l26 6 28 -6 26 6 v54 l-26 -6 -28 6 -26 -6z" fill="#F3E2C7" stroke="#C9965F" stroke-width="2"/><path d="M-30 -20 q16 -24 30 -8 t28 -14" fill="none" stroke="#D63B2F" stroke-width="2.5" stroke-dasharray="4 4"/><path d="M22 -46 l8 8 M30 -46 l-8 8" stroke="#D63B2F" stroke-width="3"/></g></sc-if>
          <sc-if value="{{p.is.chest}}" hint-placeholder-val="{{false}}"><g data-kind="chest"><rect x="-26" y="-26" width="52" height="26" rx="4" fill="#A0531C"/><path d="M-28 -26 q28 -22 56 0z" fill="#C9763A"/><rect x="-5" y="-30" width="10" height="12" rx="2" fill="#F5B53D"/></g></sc-if>
          <sc-if value="{{p.is.bird}}" hint-placeholder-val="{{false}}"><g data-kind="bird"><ellipse cy="-10" rx="14" ry="9" fill="#2F86C9"/><circle cx="12" cy="-16" r="7" fill="#2F86C9"/><path d="M18 -16 l6 2 -6 2z" fill="#F5B53D"/><path d="M-6 -14 q-8 -14 8 -10z" fill="#1F5F92"/><circle cx="13" cy="-17" r="1.4" fill="#3B2418"/></g></sc-if>
          <sc-if value="{{p.is.lamp}}" hint-placeholder-val="{{false}}"><g data-kind="lamp"><rect x="-2" y="-50" width="4" height="50" fill="#7A5A45"/><path d="M-18 -50 l8 -24 h20 l8 24z" fill="#F5B53D"/><ellipse cy="0" rx="14" ry="4" fill="#7A5A45"/></g></sc-if>
          <sc-if value="{{p.is.cup}}" hint-placeholder-val="{{false}}"><g data-kind="cup"><path d="M-14 -26 h28 v16 a10 10 0 0 1 -10 10 h-8 a10 10 0 0 1 -10 -10z" fill="#E46A8E"/><path d="M14 -22 h5 a6 6 0 0 1 0 12 h-5" fill="none" stroke="#E46A8E" stroke-width="3.5"/><path d="M-4 -32 q-4 -6 0 -10 M4 -32 q-4 -6 0 -10" fill="none" stroke="#B9B3C9" stroke-width="2"/></g></sc-if>
          <sc-if value="{{p.is.satellite}}" hint-placeholder-val="{{false}}"><g data-kind="satellite"><rect x="-3" y="-30" width="6" height="30" fill="#7A8C9C"/><path d="M-30 -66 a34 34 0 0 0 46 40z" fill="#D7E1EA" stroke="#9DB4C8" stroke-width="2"/><rect x="-3" y="-56" width="4" height="24" transform="rotate(-40 -1 -44)" fill="#7A8C9C"/><circle cx="8" cy="-58" r="4" fill="#D63B2F"/></g></sc-if>
          <sc-if value="{{p.is.trophy}}" hint-placeholder-val="{{false}}"><g data-kind="trophy"><path d="M-18 -60 h36 v14 a18 18 0 0 1 -36 0z" fill="#B9C2CC"/><path d="M-18 -56 h-8 a8 8 0 0 0 8 14 M18 -56 h8 a8 8 0 0 1 -8 14" fill="none" stroke="#B9C2CC" stroke-width="4"/><rect x="-4" y="-30" width="8" height="16" fill="#9AA4AE"/><rect x="-16" y="-14" width="32" height="14" rx="3" fill="#7A5A45"/></g></sc-if>
        </g>
      </sc-for>
    </svg>
    <div style="padding: 16px 18px 14px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1; min-height: 0; overflow-y: auto">
      <sc-if value="{{cover}}" hint-placeholder-val="{{true}}">
        <span style="align-self: flex-start; padding: 5px 10px; border-radius: 999px; background: #ECE6FB; color: #5A40A8; font-size: 12px; font-weight: 900">{{metaLine}}</span>
        <h2 style="margin: 0; font-size: 26px; line-height: 31px; font-weight: 900; text-wrap: balance">{{title}}</h2>
        <span style="font-size: 15px; line-height: 21px; font-weight: 700; color: #5C4334">{{coverBlurb}}</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{tags}}" as="t" hint-placeholder-count="3"><span style="padding: 5px 10px; border-radius: 999px; background: #FCEBD3; font-size: 12px; font-weight: 900; color: #A0531C">{{t}}</span></sc-for></div>
        <span style="flex-grow: 1"></span>
        <button type="button" class="tile" onClick="{{open}}" style="height: 56px; border-radius: 999px; background: #D63B2F; color: #FFFFFF; font-size: 19px; font-weight: 900; box-shadow: 0 5px 0 #A8281E">Read with me</button>
      </sc-if>
      <sc-if value="{{reading}}" hint-placeholder-val="{{false}}">
        <p style="margin: 0; font-size: {{fontSize}}px; line-height: 1.5; font-weight: 800"><sc-for list="{{words}}" as="w" hint-placeholder-count="12"><span style="background: {{w.bg}}; border-radius: 6px; padding: 0 1px">{{w.t}}</span></sc-for></p>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{reading}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button type="button" class="tile" onClick="{{prev}}" aria-label="Previous page" style="width: 58px; height: 58px; border-radius: 999px; background: #35261C; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FCEFDF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
        <button type="button" class="tile" onClick="{{toggle}}" aria-label="{{playLabel}}" style="width: 72px; height: 72px; border-radius: 999px; background: #E8574A; display: grid; place-items: center; box-shadow: 0 5px 0 #B83A2F">
          <sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#FFFFFF"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#FFFFFF"/></svg></sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg></sc-if>
        </button>
        <span style="font-size: 13px; font-weight: 800; color: #CDB39C">{{pageLabel}}</span>
      </div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    fetch('content/stories.json').then((r) => r.json()).then((d) => this.setState({ lib: d })).catch(() => this.setState({ failed: true }));
    this.iv = setInterval(() => { const s = this.state || {}; if (s.reading && s.playing !== false) this.setState({ w: (s.w || 0) + 1 }); }, 380);
  }
  componentWillUnmount() { clearInterval(this.iv); try { speechSynthesis.cancel(); } catch (e) {} }
  kid() {
    const get = (k) => { try { return (localStorage.getItem(k) || '').trim(); } catch (e) { return ''; } };
    const name = get('avilo.kid') || 'Your child';
    const g = get('avilo.gender');
    const P = g === 'boy' ? { he: 'he', him: 'him', his: 'his' } : g === 'girl' ? { he: 'she', him: 'her', his: 'her' } : { he: 'they', him: 'them', his: 'their' };
    const cap = (x) => x.charAt(0).toUpperCase() + x.slice(1);
    return { name: name, gender: g, P: P, color: get('avilo.color') || 'purple', fill: (t) => t.replace(/\{name\}/g, name).replace(/\{He\}/g, cap(P.he)).replace(/\{His\}/g, cap(P.his)).replace(/\{he\}/g, P.he).replace(/\{him\}/g, P.him).replace(/\{his\}/g, P.his).replace(/\bthey was\b/g, 'they were') };
  }
  say(text) { try { const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {} }
  renderVals() {
    const s = this.state || {};
    const K = this.kid();
    const COL = { red: '#D63B2F', orange: '#E9873A', yellow: '#F5B53D', green: '#4E9F3D', blue: '#2F86C9', purple: '#8466D6', pink: '#E46A8E', brown: '#A0531C' };
    const books = (s.lib && s.lib.books) || [];
    let id = ''; try { id = localStorage.getItem('avilo.book') || ''; } catch (e) {}
    const book = books.find((b) => b.id === id) || books[0];
    const vm = { byline: 'WRITTEN FOR ' + K.name.toUpperCase() + ' BY AVI', kidColor: COL[K.color] || COL.purple,
      hairPath: K.gender === 'girl' ? 'M-14 -60 a14 15 0 0 1 28 0 l2 16 -6 -4 -2 -12 a12 8 0 0 0 -14 0 l-2 12 -6 4z' : 'M-13 -64 a13 12 0 0 1 26 0 q-6 -5 -13 -5 t-13 5z',
      title: book ? K.fill(book.title) : (s.failed ? 'Could not load stories' : 'Loading…'), cover: !s.reading, reading: !!s.reading, props: [], sky: { day: true }, ground: { grass: true }, sceneAria: 'Story illustration',
      open: () => { this.setState({ reading: true, i: 0, w: 0, playing: true }); if (book) this.say(K.fill(book.pages[0].t)); }, tags: [], words: [], metaLine: '', coverBlurb: '' };
    if (!book) return vm;
    const len = book.pages.length, i = Math.min(s.i || 0, len - 1);
    let sceneIdx = s.reading ? i : 0; while (sceneIdx > 0 && !book.pages[sceneIdx].scene) sceneIdx--;
    const sc = book.pages[sceneIdx].scene;
    vm.sky = { [sc.sky]: true }; vm.ground = { [sc.ground]: true };
    vm.props = sc.props.map((p) => ({ is: { [p.k]: true }, tf: 'translate(' + p.x + ' ' + p.y + ') scale(' + p.s + ')' }));
    vm.sceneAria = 'Illustration: ' + sc.props.map((p) => (p.k === 'kid' ? K.name : p.k)).join(', ');
    const minutes = { cubs: 5, explorers: 10, trailblazers: 18 }[book.band];
    vm.metaLine = len + ' pages · ' + minutes + ' min · ' + ({ cubs: 'Little Cubs', explorers: 'Explorers', trailblazers: 'Trailblazers' }[book.band]);
    vm.coverBlurb = 'A story made for ' + K.name + '. Practises: ' + book.skill.toLowerCase() + '.';
    vm.tags = book.tags.slice(0, 3).map((t) => t.charAt(0).toUpperCase() + t.slice(1));
    if (s.reading) {
      const text = K.fill(book.pages[i].t);
      const ws = text.split(' ');
      const wi = (s.w || 0) % (ws.length + 6);
      vm.words = ws.map((t, k) => ({ t: t + ' ', bg: s.playing !== false && k === wi ? '#F5B53D' : 'transparent' }));
      vm.fontSize = book.band === 'cubs' ? 22 : book.band === 'explorers' ? 19 : 17;
      vm.pageLabel = 'Page ' + (i + 1) + ' of ' + len;
      vm.playing = s.playing !== false; vm.paused = s.playing === false; vm.playLabel = s.playing === false ? 'Read aloud' : 'Pause';
      vm.toggle = () => { const play = s.playing === false; this.setState({ playing: play, w: 0 }); if (play) this.say(text); else { try { speechSynthesis.cancel(); } catch (e) {} } };
      vm.prev = () => { if (i === 0) this.setState({ reading: false }); else { this.setState({ i: i - 1, w: 0 }); if (s.playing !== false) this.say(K.fill(book.pages[i - 1].t)); } };
      vm.next = () => { if (i + 1 < len) { this.setState({ i: i + 1, w: 0 }); if (s.playing !== false) this.say(K.fill(book.pages[i + 1].t)); } else this.setState({ reading: false, i: 0 }); };
    }
    return vm;
  }
}
</script>
