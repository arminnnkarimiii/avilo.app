<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parent dashboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap">
<style>
body{margin:0}
.avi{image-rendering:pixelated;mix-blend-mode:multiply;object-fit:contain}
.tile{border:0;cursor:pointer;font-family:Nunito,ui-rounded,system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFF6E8; font-family: Nunito, ui-rounded, system-ui, sans-serif; color: #3B2418; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 12px; padding: 54px 18px 10px">
    <a href="KidHome.dc.html" aria-label="Back to the kids' home" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; border: 2px solid #EED9BF; display: grid; place-items: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3B2418" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 13px; font-weight: 800; color: #7A5A45">Grown-ups · this week</span><span style="font-size: 24px; line-height: 28px; font-weight: 900">{{heading}}</span></div>
    <div style="width: 60px; height: 60px; border-radius: 999px; background: #FCEBD3; display: grid; place-items: center; flex: none"><img class="avi" src="/_blob/f12160152564bafe0360fc2889166f47" alt="Avi having tea" style="width: 56px; height: 56px"></div>
  </div>
  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 24px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
        <div style="background: #FFFFFF; border: 2px solid #EED9BF; border-radius: 16px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 21px; font-weight: 900; color: {{s.c}}">{{s.v}}</span><span style="font-size: 11.5px; font-weight: 800; color: #7A5A45; text-align: center">{{s.l}}</span></div>
      </sc-for>
    </div>
    <div style="background: #A0531C; border-radius: 20px; padding: 14px 16px; color: #FFFFFF; display: flex; gap: 12px; align-items: flex-start">
      <span style="width: 34px; height: 34px; border-radius: 999px; background: #B8692F; display: grid; place-items: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></span>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; font-weight: 900; letter-spacing: .8px; color: #FFE2C4">AVI'S INSIGHT</span><span style="font-size: 15px; line-height: 21px; font-weight: 700">{{insight}}</span></div>
    </div>
    <div style="background: #FFFFFF; border: 2px solid #EED9BF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 17px; font-weight: 900">Skills by world</span>
      <sc-for list="{{skills}}" as="k" hint-placeholder-count="8">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 800"><span>{{k.name}}</span><span style="color: {{k.tc}}">{{k.state}}</span></div>
          <div style="height: 9px; border-radius: 999px; background: {{k.soft}}; overflow: hidden"><div style="width: {{k.p}}%; height: 100%; border-radius: 999px; background: {{k.c}}"></div></div>
        </div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 2px solid #EED9BF; border-radius: 20px; display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 2px solid #F5E6D2">
        <span style="flex-grow: 1; font-size: 15px; font-weight: 800">Weekly summary email</span>
        <button type="button" class="tile" onClick="{{toggleWeekly}}" role="switch" aria-checked="{{weeklyAria}}" aria-label="Weekly summary email" style="width: 52px; height: 32px; border-radius: 999px; background: {{weeklyBg}}; position: relative; flex: none"><span style="position: absolute; left: {{knobLeft}}px; top: 3px; width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF"></span></button>
      </div>
      <a href="QuizName.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 2px solid #F5E6D2; text-decoration: none; color: #3B2418"><span style="flex-grow: 1; font-size: 15px; font-weight: 800">{{editLabel}}</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A5A45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
      <a href="Paywall.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-decoration: none; color: #3B2418"><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 800">Education+ · Yearly</span><span style="font-size: 13px; font-weight: 600; color: #7A5A45">Free trial: 6 days left</span></span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7A5A45" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
const W = [['math', 'Math Meadow', '#4E9F3D', '#E3F3DD', '#2F6B23', 78], ['reading', 'Reading Forest', '#2F86C9', '#DDEEFB', '#1F5F92', 44], ['science', 'Science Sky', '#8466D6', '#ECE6FB', '#5A40A8', 30],
  ['feelings', 'Feelings Cottage', '#E46A8E', '#FCE4EB', '#A3355A', 56], ['logic', 'Logic Lane', '#2F86C9', '#DDEEFB', '#1F5F92', 38], ['memory', 'Memory Pond', '#8466D6', '#ECE6FB', '#5A40A8', 42],
  ['creativity', 'Creativity Studio', '#D63B2F', '#FCE4EB', '#A8281E', 60], ['wiggle', 'Wiggle Park', '#D9894A', '#FCEBD3', '#A0531C', 70]];
function get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const name = get('avilo.kid').trim() || 'Your child';
    const g = get('avilo.gender'), his = g === 'boy' ? 'his' : g === 'girl' ? 'her' : 'their';
    let at = []; try { at = JSON.parse(get('avilo.attempts') || '[]'); } catch (e) {}
    let ans = {}; try { ans = JSON.parse(get('avilo.answers') || '{}'); } catch (e) {}
    const demo = at.length < 5;
    const skills = W.map((w) => {
      const mine = at.filter((a) => a.world === w[0]);
      const acc = demo ? w[5] : mine.length ? Math.round(100 * mine.filter((a) => a.ok).length / mine.length) : 0;
      const state = !demo && !mine.length ? 'Not started' : acc >= 75 ? 'Strong' : acc >= 50 ? 'Growing' : 'Practising';
      return { id: w[0], name: w[1], c: w[2], soft: w[3], tc: w[4], p: acc, state: state, acc: acc, n: demo ? 3 : mine.length };
    });
    const played = skills.filter((k) => k.n > 0).sort((a, b) => b.acc - a.acc);
    const best = played[0] || skills[0], worst = played[played.length - 1] || skills[1];
    const goals = Object.keys(ans.goals || {});
    const goalText = goals.includes('reading') ? ' Reading confidence is your top goal, so tonight’s story practises tricky words.' : goals.includes('feelings') ? ' You asked for feelings and friendships, so Feelings Cottage comes up daily.' : '';
    const mins = demo ? 48 : Math.round(at.reduce((t, a) => t + a.ms, 0) / 60000);
    const target = parseInt(get('avilo.minutes') || '15', 10);
    const weekly = s.weekly !== false;
    return {
      heading: name + '’s week',
      stats: [{ v: mins + 'm', l: 'minutes', c: '#3B2418' }, { v: String(demo ? 5 : new Set(at.map((a) => new Date(a.ts).toDateString())).size), l: 'day streak', c: '#D63B2F' },
        { v: String(demo ? 14 : new Set(at.map((a) => a.id)).size), l: 'activities', c: '#3B2418' }, { v: (demo ? 85 : Math.round(100 * at.filter((a) => a.ok).length / Math.max(1, at.length))) + '%', l: 'accuracy', c: '#2F6B23' }],
      insight: (demo ? 'Example: ' : '') + name + ' is strongest in ' + best.name + ' (' + best.acc + '% right) and still building ' + worst.name + ' (' + worst.acc + '%). This week Avi will mix ' + worst.name + ' into ' + his + ' favourite themes, aiming for ' + target + ' minutes a day.' + goalText,
      skills: skills,
      weeklyAria: weekly ? 'true' : 'false', weeklyBg: weekly ? '#4E9F3D' : '#C9AE92', knobLeft: weekly ? 23 : 3, toggleWeekly: () => this.setState({ weekly: !weekly }),
      editLabel: 'Edit ' + name + '’s learning profile'
    };
  }
}
</script>
</body>
</html>
